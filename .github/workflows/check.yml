name: Quality gates
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: make check
      - name: Full legacy security scan (review artifact)
        if: always()
        run: python -m bandit -r skills -f json -o bandit-skills.json --exit-zero
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-skills-${{ matrix.python }}
          path: bandit-skills.json
